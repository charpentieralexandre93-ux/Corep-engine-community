name: Community CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      # Securite : bloquant (aucun site SQL f-string dans la community).
      - name: bandit (bloquant)
        run: |
          pip install bandit
          bandit -r src/corep_crr3 -ll

      - name: pytest + couverture
        run: >-
          python -m pytest -q
          --cov=corep_crr3 --cov-report=term-missing --cov-report=xml
          --cov-fail-under=75

      - name: pip-audit (report-only)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

      - name: Publier la couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
