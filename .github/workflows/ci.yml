name: Community CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      # ruff BLOQUANT (v4.2.9) — erreurs critiques uniquement (syntaxe, noms non définis).
      - name: ruff (bloquant — erreurs critiques)
        run: |
          pip install ruff
          ruff check --select=E9,F63,F7,F82 src

      # mypy report-only — retirer `|| true` pour le rendre bloquant après tri local.
      - name: mypy (report-only)
        run: |
          pip install "mypy<2.0"
          mypy src/corep_crr3 || true

      # Securite : bloquant (aucun site SQL f-string dans la community).
      - name: bandit (bloquant)
        run: |
          pip install bandit
          bandit -r src/corep_crr3 -ll

      - name: pytest + couverture
        run: >-
          python -m pytest -q
          --cov=corep_crr3 --cov-report=term-missing --cov-report=xml
          --cov-fail-under=61

      - name: pip-audit (report-only)
        continue-on-error: true
        run: |
          pip install pip-audit || true
          pip-audit || true

      - name: SBOM (CycloneDX)
        if: matrix.python-version == '3.11'
        continue-on-error: true
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o sbom.cdx.json || cyclonedx-py -o sbom.cdx.json

      - name: Publier le SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: ignore

      - name: Publier la couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  postgres-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: corep_crr3
          POSTGRES_USER: corep_user
          POSTGRES_PASSWORD: corep_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corep_user -d corep_crr3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://corep_user:corep_password@localhost:5432/corep_crr3
      RUN_POSTGRES_E2E: "1"
      RUN_POSTGRES_E2E_RESET: "1"
      COREP_ALLOW_DESTRUCTIVE_RESET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,postgres]"
      - name: Bootstrap SQL + moteurs SA / SA-CCR réels
        run: python -m pytest -q tests/test_postgresql_community_e2e.py
