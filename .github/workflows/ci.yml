name: Community CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: community-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PGPASSWORD: "corep_password"
  SOURCE_DATE_EPOCH: "1781481600"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Qualité statique et intégrité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les outils verrouillés
        run: |
          python -m pip install --require-hashes -r requirements-dev-py311-linux.lock
          python -m pip install --no-deps -e ".[dev,postgres]"
      - name: Contrat public, version et manifeste
        run: |
          python tools/check_release_contract.py
          python tools/bump_version.py --check
          python -m corep_crr3.release_integrity \
            --root . --manifest RELEASE_MANIFEST.json --version 6.3.0
      - name: Politique des exceptions larges
        run: python tools/check_broad_exception_policy.py
      - name: Ruff complet et complexité
        run: ruff check src tools tests benchmarks scripts
      - name: Formatage déterministe
        run: ruff format --check src tools tests benchmarks scripts
      - name: Mypy Community bloquant
        run: mypy src/corep_crr3
      - name: Bandit Medium/High
        run: bandit -r src/corep_crr3 -ll
      - name: Documentation des points d'entrée
        run: python tools/check_cli_docstrings.py --min-percent 85

  tests:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer le projet
        shell: bash
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            python -m pip install --require-hashes -r requirements-dev-py311-linux.lock
            python -m pip install --no-deps -e ".[dev,postgres]"
          else
            python -m pip install -e ".[dev,postgres]"
          fi
      - name: Tests et couverture branches
        run: >-
          python -m pytest -q
          --cov=corep_crr3 --cov-branch
          --cov-report=term-missing --cov-report=xml --cov-report=json:coverage.json
          --cov-fail-under=65
      - name: Couverture de branche du moteur SA refactoré
        if: matrix.python-version == '3.11'
        run: >-
          python tools/branch_coverage_delta.py coverage.json
          --baseline evidence/coverage_baseline_v6_3_0.json
          --version 6.3.0
          --module standard_engine.py
          --module saccr_engine.py
          --module community_gui.py
          --output evidence/branch_coverage_v6_3_0.json
      - name: Publier la couverture
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: community-coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
            evidence/branch_coverage_v6_3_0.json
          if-no-files-found: warn

  performance:
    name: Budget de performance SA / SA-CCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer la baseline verrouillée
        run: |
          python -m pip install --require-hashes -r requirements-dev-py311-linux.lock
          python -m pip install --no-deps -e ".[dev,postgres]"
      - name: Mesurer les noyaux purs
        run: >-
          PYTHONPATH=src python benchmarks/bench_pure_kernels.py
          --iterations 50000 --min-calls-per-second 5000
          --json-output evidence/performance_v6_3_0.json
      - name: Publier la preuve de performance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: community-performance
          path: evidence/performance_v6_3_0.json
          if-no-files-found: error

  supply-chain:
    name: Supply-chain runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les outils verrouillés
        run: python -m pip install --require-hashes -r requirements-dev-py311-linux.lock
      - name: Audit runtime bloquant
        id: runtime-audit
        continue-on-error: true
        run: |
          mkdir -p evidence
          pip-audit -r requirements-runtime-py311-linux.lock --strict \
            -f json -o evidence/pip-audit-runtime.json
      - name: Audit toolchain informatif
        id: toolchain-audit
        continue-on-error: true
        run: |
          pip-audit -r requirements-dev-py311-linux.lock --strict \
            -f json -o evidence/pip-audit-toolchain.json
      - name: SBOM CycloneDX runtime
        if: always()
        run: |
          cyclonedx-py requirements requirements-runtime-py311-linux.lock -o sbom.cdx.json
          python tools/enrich_sbom_licenses.py sbom.cdx.json \
            --required-lock requirements-runtime-py311-linux.lock --strict
          test -s sbom.cdx.json
          python tools/check_sbom_lock_sync.py
      - name: Publier audits et SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: community-supply-chain
          path: |
            evidence/pip-audit-runtime.json
            evidence/pip-audit-toolchain.json
            sbom.cdx.json
          if-no-files-found: warn
      - name: Appliquer le verdict runtime
        if: always()
        run: |
          test "${{ steps.runtime-audit.outcome }}" = "success"

  package-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-dev-py311-linux.lock
      - name: Vérifier le manifeste
        run: >-
          PYTHONPATH=src python -m corep_crr3.release_integrity
          --root . --manifest RELEASE_MANIFEST.json --version 6.3.0
      - name: Build reproductible A
        run: python -m build --wheel --no-isolation --outdir dist-a
      - name: Build reproductible B
        run: |
          rm -rf build src/*.egg-info
          python -m build --wheel --no-isolation --outdir dist-b
      - name: Construire deux ZIP source déterministes
        run: |
          python tools/build_source_archive.py --root . \
            --output /tmp/corep-community-source-a.zip \
            --prefix Corep_engine_community_v6.3.0
          python tools/build_source_archive.py --root . \
            --output /tmp/corep-community-source-b.zip \
            --prefix Corep_engine_community_v6.3.0
          test "$(sha256sum /tmp/corep-community-source-a.zip | cut -d' ' -f1)" = \
               "$(sha256sum /tmp/corep-community-source-b.zip | cut -d' ' -f1)"
          python tools/build_source_archive.py --verify /tmp/corep-community-source-a.zip \
            --prefix Corep_engine_community_v6.3.0
      - name: Vérifier les empreintes et le wheel public
        run: |
          sha256sum dist-a/*.whl dist-b/*.whl
          test "$(sha256sum dist-a/*.whl | cut -d' ' -f1)" = "$(sha256sum dist-b/*.whl | cut -d' ' -f1)"
          python tools/verify_public_wheel.py dist-a/*.whl
          python -m venv /tmp/corep-community-wheel
          /tmp/corep-community-wheel/bin/pip install --require-hashes -r requirements-runtime-py311-linux.lock
          /tmp/corep-community-wheel/bin/pip install --no-deps dist-a/*.whl
          /tmp/corep-community-wheel/bin/corep-community-health --output-dir /tmp/community-output --min-free-mb 0 --skip-database

  postgres-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm@sha256:da514b7d293c5e9126503f85ecd835f4fb0942a77e012fe74f016c114c3e25b8
        env:
          POSTGRES_DB: corep_crr3
          POSTGRES_USER: corep_user
          POSTGRES_PASSWORD: corep_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corep_user -d corep_crr3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://corep_user:corep_password@localhost:5432/corep_crr3
      RUN_POSTGRES_E2E: "1"
      RUN_POSTGRES_E2E_RESET: "1"
      COREP_ALLOW_DESTRUCTIVE_RESET: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --require-hashes -r requirements-dev-py311-linux.lock
          python -m pip install --no-deps -e ".[dev,postgres]"
      - name: E2E PostgreSQL détaillé
        id: postgres-tests
        shell: bash
        run: |
          mkdir -p output
          set -o pipefail
          python -m pytest -vv -s tests/test_postgresql_community_e2e.py 2>&1 | tee output/postgres_e2e.log
      - name: Readiness PostgreSQL stricte
        if: steps.postgres-tests.outcome == 'success'
        run: corep-community-health --output-dir output --min-free-mb 0 --json-output output/readiness_ci.json
      - name: Générer la preuve de release
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.postgres-tests.outcome }}" = "success" ]; then
            STATUS=PASSED
            SUMMARY="PostgreSQL Community E2E passed"
          else
            STATUS=FAILED
            SUMMARY="PostgreSQL Community E2E failed; see postgres_e2e.log"
          fi
          python tools/generate_release_evidence.py \
            --edition COMMUNITY --version 6.3.0 \
            --postgres-e2e "$STATUS" --postgres-version "PostgreSQL 16" \
            --test-summary "$SUMMARY" \
            --manifest RELEASE_MANIFEST.json \
            --dependency-audit NOT_EXECUTED \
            --output output/release_evidence_ci.json
      - name: Publier la preuve PostgreSQL
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: community-postgresql-evidence
          path: |
            output/postgres_e2e.log
            output/readiness_ci.json
            output/release_evidence_ci.json
          if-no-files-found: warn
      - name: Appliquer le verdict PostgreSQL
        if: always()
        run: test "${{ steps.postgres-tests.outcome }}" = "success"
  docker-smoke:
    name: Docker Community one-shot et PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Construire et contrôler l'image
        shell: bash
        run: |
          export PGPASSWORD=corep_password
          docker compose build --pull app
          IMAGE_ID="$(docker compose images -q app)"
          test -n "$IMAGE_ID"
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE_ID")" = "10001:10001"
      - name: Smoke test sans base
        shell: bash
        run: |
          export PGPASSWORD=corep_password
          docker compose run --rm --no-deps --entrypoint corep-community-health app \
            --output-dir /app/output --min-free-mb 0 --skip-database
          docker compose run --rm --no-deps --entrypoint python app \
            -c "import corep_crr3; assert corep_crr3.__version__ == '6.3.0'"
      - name: Bootstrap et readiness via Docker Compose
        shell: bash
        run: |
          export PGPASSWORD=corep_password
          docker compose up -d db
          for attempt in $(seq 1 30); do
            docker compose exec -T db pg_isready -U corep_user -d corep_crr3 && break
            sleep 2
          done
          docker compose exec -T db pg_isready -U corep_user -d corep_crr3
          docker compose run --rm --entrypoint corep-community-bootstrap app
          docker compose run --rm --entrypoint corep-community-health app \
            --output-dir /app/output --min-free-mb 0
      - name: Nettoyer Docker Compose
        if: always()
        run: docker compose down --volumes --remove-orphans

