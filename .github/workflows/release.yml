name: Community Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  SOURCE_DATE_EPOCH: "1781481600"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  validation:
    name: Validation complète avant publication
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publier Community
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer la toolchain verrouillée
        run: python -m pip install --require-hashes -r requirements-dev-py311-linux.lock
      - name: Vérifier tag, contrat et intégrité
        shell: bash
        run: |
          PACKAGE_VERSION="$(PYTHONPATH=src python -c 'from corep_crr3 import __version__; print(__version__)')"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          python tools/check_release_contract.py
          python tools/bump_version.py --check
          PYTHONPATH=src python -m corep_crr3.release_integrity \
            --root . --manifest RELEASE_MANIFEST.json --version "$PACKAGE_VERSION"
      - name: Construire wheel, sdist et ZIP source
        shell: bash
        run: |
          rm -rf dist build src/*.egg-info
          python -m build --no-isolation
          python tools/verify_public_wheel.py dist/*.whl
          python tools/build_source_archive.py --root . \
            --output "dist/Corep_engine_community_v${PACKAGE_VERSION}.zip" \
            --prefix "Corep_engine_community_v${PACKAGE_VERSION}"
      - name: Audit runtime bloquant
        run: |
          mkdir -p evidence
          pip-audit -r requirements-runtime-py311-linux.lock --strict \
            -f json -o evidence/pip-audit-runtime.json
      - name: SBOM runtime et sommes de contrôle
        shell: bash
        run: |
          cyclonedx-py requirements requirements-runtime-py311-linux.lock -o sbom.cdx.json
          python tools/enrich_sbom_licenses.py sbom.cdx.json \
            --required-lock requirements-runtime-py311-linux.lock --strict
          test -s sbom.cdx.json
          {
            find dist -maxdepth 1 -type f -print0
            printf '%s\0' sbom.cdx.json evidence/pip-audit-runtime.json RELEASE_MANIFEST.json
          } | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Attestation de provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: "dist/*"
      - name: Publier la release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: |
            dist/*
            sbom.cdx.json
            evidence/pip-audit-runtime.json
            SHA256SUMS.txt
            RELEASE_MANIFEST.json
          generate_release_notes: true
