name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # créer la Release
  id-token: write       # attestation de provenance (Sigstore/OIDC)
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build (wheel + sdist)
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: SBOM CycloneDX
        continue-on-error: true
        run: |
          python -m pip install -e . cyclonedx-bom
          cyclonedx-py environment -o sbom.cdx.json || cyclonedx-py -o sbom.cdx.json

      - name: Attestation de provenance (SLSA / Sigstore)
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

      - name: Créer la Release GitHub (artefacts + notes auto)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            sbom.cdx.json
          generate_release_notes: true
