name: Community Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
      - name: Vérifier tag, contrat et intégrité
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$TAG_VERSION" = "6.0.4"
          python tools/check_release_contract.py
          PYTHONPATH=src python -m corep_crr3.release_integrity \
            --root . --manifest RELEASE_MANIFEST.json --version "$TAG_VERSION"
      - name: Build wheel et sdist
        env:
          SOURCE_DATE_EPOCH: "1767225600"
        run: |
          python -m pip install --upgrade pip build pip-audit cyclonedx-bom
          python -m build
          python tools/verify_public_wheel.py dist/*.whl
      - name: Audit et SBOM
        run: |
          python -m pip install dist/*.whl
          pip-audit
          cyclonedx-py environment -o sbom.cdx.json
          python tools/enrich_sbom_licenses.py sbom.cdx.json --required-lock requirements-runtime-py311-linux.lock --strict
          sha256sum dist/* sbom.cdx.json > SHA256SUMS.txt
      - name: Attestation de provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: "dist/*"
      - name: Publier la release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: |
            dist/*
            sbom.cdx.json
            SHA256SUMS.txt
          generate_release_notes: true
