services:
  db:
    image: postgres:16-bookworm@sha256:da514b7d293c5e9126503f85ecd835f4fb0942a77e012fe74f016c114c3e25b8
    environment:
      POSTGRES_USER: corep_user
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD must be set}
      POSTGRES_DB: corep_crr3
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corep_user -d corep_crr3"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    volumes:
      - corep-community-db:/var/lib/postgresql/data

  app:
    image: corep-engine-community:${COREP_IMAGE_TAG:-local}
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://corep_user:${PGPASSWORD}@db:5432/corep_crr3
    read_only: true
    tmpfs:
      - /tmp
      - /app/output
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  corep-community-db:
