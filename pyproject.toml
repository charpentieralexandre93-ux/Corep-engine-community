[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corep-crr3-community"
version = "4.2.6"
description = "Corep Engine Community — Standard Approach et SA-CCR"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Alexandre Charpentier"}]
dependencies = [
  "psycopg2-binary>=2.9.0",
  "scipy>=1.9.0",
  "typing-extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
corep-community = "corep_crr3.public_registry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corep_crr3 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
