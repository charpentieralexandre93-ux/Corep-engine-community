[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corep-crr3-community"
version = "4.3.5"
description = "Corep Engine Community — Standard Approach et SA-CCR"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Alexandre Charpentier"}]
license = {text = "Apache-2.0"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
# Dépendances de base : suffisantes pour les fonctions de calcul PURES (SA, SA-CCR).
# psycopg2 n'est PAS requis pour le calcul — uniquement pour l'exécution sur une
# base PostgreSQL réelle (extra `postgres`).
dependencies = [
  "scipy>=1.9.0",
  "typing-extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.0"]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[project.scripts]
corep-community = "corep_crr3.public_registry:main"
corep-community-bootstrap = "corep_crr3.community_bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corep_crr3 = [
  "py.typed",
  "sql/**/*.sql",
  "sql/*.txt",
  "sql/*.json",
  "sql/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Couverture (v4.2.8) — seuil étape 1 anti-régression.
[tool.coverage.run]
source = ["corep_crr3"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
implicit_optional = true
