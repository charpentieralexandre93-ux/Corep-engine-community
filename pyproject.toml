[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corep-crr3-community"
version = "6.0.4"
description = "Corep Engine Community — cockpit graphique public SA et SA-CCR."
readme = "README.md"
requires-python = ">=3.9,<3.14"
authors = [{name = "Alexandre Charpentier"}]
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-COMMUNITY.md", "NOTICE"]
# Dépendances de base : suffisantes pour les fonctions de calcul PURES (SA, SA-CCR).
# psycopg2 n'est PAS requis pour le calcul — uniquement pour l'exécution sur une
# base PostgreSQL réelle (extra `postgres`).
dependencies = [
  "typing-extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.0"]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "mypy<2.0",
  "types-psycopg2>=2.9",
]

[project.scripts]
corep-community = "corep_crr3.public_registry:main"
corep-community-bootstrap = "corep_crr3.community_bootstrap:main"
corep-community-gui = "corep_crr3.community_gui:main"
corep-community-health = "corep_crr3.operational_readiness:main"
corep-community-release-verify = "corep_crr3.release_integrity:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corep_crr3 = [
  "py.typed",
  "sql/**/*.sql",
  "sql/*.txt",
  "sql/*.json",
  "sql/*.md",
  "resources/legal/*",
  "resources/release/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Couverture v6.0.0 — seuil global et garde-fous publics anti-régression.
[tool.coverage.run]
source = ["corep_crr3"]
branch = true
omit = ["*/tests/*", "*/community_gui.py"]

[tool.coverage.report]
show_missing = true


[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
